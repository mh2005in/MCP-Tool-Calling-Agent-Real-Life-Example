server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container over the internal
    # network. The Spring Boot app runs with context-path=/api, so /api/v1/...
    # from the SPA maps straight through. Keeping the SPA and API same-origin
    # avoids CORS entirely.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Angular single-page-app routing: fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

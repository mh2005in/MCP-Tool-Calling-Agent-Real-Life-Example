# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/immiauto?currentSchema=immiauto_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:immiauto_user}
spring.datasource.password=${DB_PASSWORD:ChangeThisStrongPassword123!}

# ---- Form & Package Automation (Section 4.1) ----
# Generate the synthetic pilot AcroForm (IMM 5476) on dev startup so generation works end-to-end.
app.forms.seed-sample-pdf=true

# ---- Mail (configure for production) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
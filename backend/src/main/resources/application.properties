# ============================================================
# Immigration Automation - Application Configuration
# ============================================================

spring.application.name=immigration-automation

# ---- Server ----
server.port=8080
server.servlet.context-path=/api

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/immiauto?currentSchema=immiauto_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:immiauto_user}
spring.datasource.password=${DB_PASSWORD:ChangeThisStrongPassword123!}
spring.h2.console.enabled=false

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=immiauto_db
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false

# ---- Seed Data ----
app.seed.enabled=false

# ---- File Upload ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# ---- Form & Package Automation (Section 4.1) ----
# Governed source PDFs live here as {formCode}/{edition}/source.pdf
app.forms.source-dir=./forms/source
# Generated draft forms/packages are written under app.upload.dir/{caseNumber}/generated/...
app.forms.max-generated-package-bytes=104857600
# Dev-only convenience: generate a synthetic fillable AcroForm for the pilot form (IMM 5476)
app.forms.seed-sample-pdf=false
# Max size for a consultant-uploaded filled form (PDF), in bytes (default 25MB)
app.forms.max-upload-bytes=26214400

# ---- CORS ----
# Browser origin(s) allowed to call the API (comma-separated). Defaults to the Angular dev server;
# in Docker the frontend is served by nginx on the published host port, so override via
# CORS_ALLOWED_ORIGINS (set in docker-compose to http://localhost:${FRONTEND_HOST_PORT}).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---- Keycloak (OAuth2 / OIDC Resource Server) ----
# issuer-uri is the PUBLIC realm URL used to validate the token's `iss` claim (what the browser
# and Keycloak use). jwk-set-uri is resolved separately so the container can fetch signing keys
# over the internal Docker network (http://keycloak:8080) without a localhost issuer mismatch.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8085/realms/immiauto}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8085/realms/immiauto/protocol/openid-connect/certs}
# Audience(s) accepted in the token's aud claim - comma-separated. The frontend client is
# configured (audience mapper) to include the backend client id in aud.
app.security.audience=${OIDC_AUDIENCE:immiauto-backend}
app.security.audience-validation.enabled=${OIDC_AUDIENCE_VALIDATION:true}
# When true, an unknown authenticated user is provisioned as a new consultant on first login
# (self-serve MVP). Set to false to require pre-registered consultants only.
app.security.auto-provision-consultant.enabled=${AUTO_PROVISION_CONSULTANT:true}

# ---- MCP API Keys ----
# Per-consultant API keys are auto-generated and stored in the database.
# Each consultant gets a unique key on creation (format: mcp_<uuid>).

# ---- Mail (configure for production) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ============================================================
# Immigration MCP Server - Configuration
# ============================================================

spring.application.name=immigration-mcp-server

# ---- Server (must differ from the backend on 8080) ----
server.port=8084

# ---- Keycloak (OAuth2 / OIDC Resource Server) ----
# Same realm/issuer as the backend. issuer-uri validates the token's public `iss`; jwk-set-uri
# fetches signing keys over the internal Docker network to avoid a localhost issuer mismatch.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8085/realms/immiauto}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8085/realms/immiauto/protocol/openid-connect/certs}
app.security.audience=${OIDC_MCP_AUDIENCE:immiauto-mcp}
# Off by default: MCP is called by AI-assistant clients whose token audience is provisioned when
# those clients are onboarded. Enable once such clients carry aud=immiauto-mcp.
app.security.audience-validation.enabled=${OIDC_MCP_AUDIENCE_VALIDATION:false}

# ---- MCP protected-resource metadata ----
# Public base URL of THIS MCP server (used in /.well-known/oauth-protected-resource).
app.mcp.resource=${MCP_RESOURCE:http://localhost:8084/mcp}

# ---- Tool config ----
# Optional external tools.json path; falls back to classpath config/tools.json.
mcp.tool.config=${MCP_TOOL_CONFIG:}

# ---- Backend service-account token (Keycloak client-credentials) for authenticated audit POSTs ----
# The MCP client has service accounts enabled and an audience mapper (aud=immiauto-backend), so the
# backend accepts the token. It identifies the MCP service account, not the calling user.
mcp.backend.token-endpoint=${OIDC_TOKEN_ENDPOINT:http://localhost:8085/realms/immiauto/protocol/openid-connect/token}
mcp.backend.client-id=${MCP_CLIENT_ID:immiauto-mcp}
mcp.backend.client-secret=${MCP_CLIENT_SECRET:}

# ---- Audit (POST tool invocations to the backend audit endpoint) ----
mcp.backend.audit-url=${MCP_AUDIT_URL:http://localhost:8080/api/v1/mcp/audit}
